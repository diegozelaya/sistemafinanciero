{%extends 'layout.html'%}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% endblock %}

{%block body%}
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th,
  td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

  #modalRefinanciar {
    display: none;
    border: 1px solid #aaa;
    padding: 20px;
    margin-top: 20px;
    background: #f9f9f9;
  }

  .fechaCuota {
    margin-bottom: 5px;
    display: block;
  }
</style>
</head>

<body>

  <h2>Refinanciación de Matrícula</h2>

  <label for="selectCliente">Buscar alumno:</label>
  <select id="selectCliente" style="width: 100%"></select>

  <div id="datosMatricula" style="margin-top: 20px;">
    <h3>Cuotas pendientes</h3>
    <table id="tablaCuotas" class="table table-striped table-bordered bg-white table-sm">
      <thead>
        <tr>
          <th>Concepto</th>
          <th>Vencimiento</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p>Total adeudado: <strong id="totalAdeudado">0</strong></p>
    <button id="btnRefinanciar" class=" btn btn-secondary">Refinanciar</button>
  </div>


  <div id="modalRefinanciar" class="modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Refinanciación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <h3>Configurar nueva cuenta</h3>
          <label>Cantidad de cuotas:</label>
          <input type="number" id="cantidadCuotas" min="1" />
          <div id="fechasContainer"></div>

          <button id="confirmarRefinanciacion" class="btn btn-primary btn-sm">Confirmar refinanciación</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>






  <script src={{url_for('static', filename='js/refi.js' )}}></script>
</body>

</html>

{%endblock%}
