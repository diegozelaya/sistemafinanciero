{% extends 'layout.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/venta.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block body %}
<div class="container mt-5">
  <h1 class="text-center mb-4 fw-bold">INGRESOS POR PRODUCTO</h1>

  <form id="form-fechas" method="POST" action="/ingresos_por_producto" class="card p-4 shadow-sm">
    <div class="mb-3">
      

      <label for="producto" class="form-label">Seleccione el producto:</label>
      <select class="form-select" id="producto" name="producto" required>
        <option value="">Seleccione un Producto</option>
        {% for p in productos %}
          <option value="{{ p.idproducto }}">{{ p.nombre }}</option>
        {% endfor %}
        
       
      </select>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="fecha_desde" class="form-label">Fecha desde:</label>
        <input type="date" class="form-control" id="fecha_desde" name="fecha_desde" required value="{{ fecha_desde or '' }}">
      </div>
      <div class="col">
        <label for="fecha_hasta" class="form-label">Fecha hasta:</label>
        <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta" required value="{{ fecha_hasta or '' }}">
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">Ver ingresos</button>
      <button type="button" class="btn btn-secondary" onclick="window.location.href='/ingresos_por_producto'">Limpiar</button>
    </div>
  </form>

  {% if resultados %}
  <div class="card mt-4 shadow-sm">
    <div class="card-body">
      <h4 class="card-title text-center mb-3">Resultados</h4>
      <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
          <tr>
            <th>Concepto</th>
            <th>Monto Total (Gs)</th>
          </tr>
        </thead>
        <tbody>
          {% for r in resultados %}
          <tr>
            <td>{{ r.concepto }}</td>
            <td>{{ r.monto }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  {% endif %}
</div>

<script>
  document.getElementById('form-fechas').addEventListener('submit', function (e) {
    const desde = document.getElementById('fecha_desde').value;
    const hasta = document.getElementById('fecha_hasta').value;
    if (desde > hasta) {
      e.preventDefault();
      alert("La fecha 'desde' no puede ser mayor que 'hasta'.");
    }
  });
</script>
{% endblock %}
